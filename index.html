<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>PDF Editor</title>

    <!--
        PDF.js
        Used to render PDF pages in the browser.
    -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs"
            type="module"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family:
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background: #f1f3f4;
            color: #202124;
        }


        /* ==============================
           HEADER
        ============================== */

        header {
            height: 64px;

            background: white;

            border-bottom: 1px solid #ddd;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 20px;

            position: sticky;

            top: 0;

            z-index: 100;
        }


        .logo {
            font-size: 20px;

            font-weight: 700;
        }


        .header-actions {
            display: flex;

            gap: 8px;

            align-items: center;
        }


        /* ==============================
           BUTTONS
        ============================== */

        button {
            border: none;

            border-radius: 6px;

            padding: 9px 15px;

            cursor: pointer;

            font-size: 14px;
        }


        button:disabled {
            opacity: 0.5;

            cursor: not-allowed;
        }


        .primary {
            background: #1a73e8;

            color: white;
        }


        .primary:hover:not(:disabled) {
            background: #1557b0;
        }


        .secondary {
            background: #e8eaed;

            color: #202124;
        }


        .secondary:hover:not(:disabled) {
            background: #d9dce1;
        }


        .danger {
            background: #d93025;

            color: white;
        }


        /* ==============================
           UPLOAD SCREEN
        ============================== */

        #uploadScreen {

            min-height: calc(100vh - 64px);

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 30px;
        }


        .upload-box {

            background: white;

            width: 100%;

            max-width: 600px;

            padding: 50px 30px;

            text-align: center;

            border-radius: 15px;

            box-shadow:
                0 4px 20px rgba(0,0,0,0.08);
        }


        .upload-icon {
            font-size: 55px;

            margin-bottom: 15px;
        }


        .upload-box h1 {
            margin-bottom: 10px;
        }


        .upload-box p {
            color: #666;

            line-height: 1.6;
        }


        #fileInput {
            display: none;
        }


        .upload-button {
            display: inline-block;

            background: #1a73e8;

            color: white;

            padding: 12px 20px;

            border-radius: 7px;

            cursor: pointer;

            margin-top: 15px;
        }


        .upload-button:hover {
            background: #1557b0;
        }


        /* ==============================
           EDITOR
        ============================== */

        #editor {

            display: none;

            height: calc(100vh - 64px);

            overflow: hidden;
        }


        .editor-layout {

            display: grid;

            grid-template-columns: 250px 1fr 260px;

            height: 100%;
        }


        /* ==============================
           LEFT SIDEBAR
        ============================== */

        .sidebar {

            background: white;

            border-right: 1px solid #ddd;

            overflow-y: auto;

            padding: 15px;
        }


        .sidebar h3 {

            margin-top: 0;

            font-size: 15px;
        }


        #thumbnails {

            display: flex;

            flex-direction: column;

            gap: 12px;
        }


        .thumbnail {

            border: 2px solid transparent;

            border-radius: 6px;

            padding: 5px;

            cursor: pointer;

            background: #f5f5f5;
        }


        .thumbnail:hover {

            border-color: #aaa;
        }


        .thumbnail.active {

            border-color: #1a73e8;
        }


        .thumbnail canvas {

            width: 100%;

            height: auto;

            display: block;
        }


        .page-number {

            text-align: center;

            font-size: 12px;

            padding-top: 5px;

            color: #555;
        }


        /* ==============================
           PDF AREA
        ============================== */

        .pdf-area {

            background: #525659;

            overflow: auto;

            padding: 30px;

            display: flex;

            justify-content: center;

            align-items: flex-start;
        }


        #pagesContainer {

            display: flex;

            flex-direction: column;

            align-items: center;

            gap: 25px;
        }


        .pdf-page-wrapper {

            position: relative;

            background: white;

            box-shadow:
                0 4px 15px rgba(0,0,0,0.3);
        }


        .pdf-page-wrapper canvas {

            display: block;
        }


        /* ==============================
           TEXT OVERLAY
        ============================== */

        .text-layer {

            position: absolute;

            top: 0;

            left: 0;

            right: 0;

            bottom: 0;

            pointer-events: none;
        }


        .editable-text {

            position: absolute;

            min-width: 50px;

            min-height: 25px;

            padding: 3px 5px;

            border: 1px dashed #1a73e8;

            background: rgba(255,255,255,0.75);

            cursor: move;

            pointer-events: auto;

            user-select: none;

            white-space: pre-wrap;

            outline: none;
        }


        .editable-text.selected {

            border: 2px solid #1a73e8;

            background: rgba(255,255,255,0.9);
        }


        .editable-text[contenteditable="true"] {

            cursor: text;

            user-select: text;
        }


        /* ==============================
           RIGHT SIDEBAR
        ============================== */

        .properties {

            background: white;

            border-left: 1px solid #ddd;

            padding: 20px;

            overflow-y: auto;
        }


        .properties h3 {

            margin-top: 0;

            font-size: 16px;
        }


        .property {

            margin-bottom: 18px;
        }


        .property label {

            display: block;

            font-size: 13px;

            color: #555;

            margin-bottom: 6px;
        }


        .property input,
        .property select {

            width: 100%;

            padding: 8px;

            border: 1px solid #ccc;

            border-radius: 5px;

            font-size: 14px;
        }


        .color-input {

            width: 100%;

            height: 40px;

            padding: 2px;

            cursor: pointer;
        }


        .no-selection {

            color: #888;

            font-size: 13px;

            line-height: 1.5;
        }


        /* ==============================
           TOOLBAR
        ============================== */

        .toolbar {

            position: fixed;

            bottom: 20px;

            left: 50%;

            transform: translateX(-50%);

            background: white;

            border-radius: 10px;

            box-shadow:
                0 3px 15px rgba(0,0,0,0.2);

            padding: 8px;

            display: flex;

            gap: 6px;

            z-index: 200;
        }


        .toolbar button {

            white-space: nowrap;
        }


        /* ==============================
           LOADING
        ============================== */

        #loading {

            display: none;

            position: fixed;

            inset: 0;

            background: rgba(0,0,0,0.5);

            z-index: 1000;

            justify-content: center;

            align-items: center;
        }


        .loading-box {

            background: white;

            padding: 30px;

            border-radius: 10px;

            text-align: center;
        }


        .spinner {

            width: 35px;

            height: 35px;

            border: 4px solid #ddd;

            border-top-color: #1a73e8;

            border-radius: 50%;

            animation: spin 1s linear infinite;

            margin: auto auto 15px;
        }


        @keyframes spin {

            to {
                transform: rotate(360deg);
            }

        }


        /* ==============================
           RESPONSIVE
        ============================== */

        @media (max-width: 900px) {

            .editor-layout {

                grid-template-columns: 170px 1fr;
            }


            .properties {

                display: none;
            }

        }


        @media (max-width: 600px) {

            .editor-layout {

                grid-template-columns: 1fr;
            }


            .sidebar {

                display: none;
            }


            .pdf-area {

                padding: 10px;
            }


            .toolbar {

                max-width: 95%;

                overflow-x: auto;
            }

        }

    </style>
</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header>

    <div class="logo">
        📄 PDF Editor
    </div>


    <div class="header-actions">

        <button
            class="secondary"
            onclick="newDocument()">

            New PDF

        </button>


        <button
            id="saveButton"
            class="primary"
            onclick="savePDF()"
            disabled>

            💾 Save PDF

        </button>

    </div>

</header>



<!-- =====================================================
     UPLOAD SCREEN
===================================================== -->

<section id="uploadScreen">

    <div class="upload-box">

        <div class="upload-icon">
            📄
        </div>


        <h1>
            PDF Editor
        </h1>


        <p>
            Upload a PDF file to view and edit it.
        </p>


        <p>
            You can add text, move text, change
            font size and color, and save the
            edited PDF.
        </p>


        <input
            id="fileInput"
            type="file"
            accept="application/pdf"
        >


        <label
            for="fileInput"
            class="upload-button">

            📂 Upload PDF

        </label>

    </div>

</section>



<!-- =====================================================
     EDITOR
===================================================== -->

<section id="editor">


    <div class="editor-layout">


        <!-- ============================
             LEFT: PAGE THUMBNAILS
        ============================= -->

        <aside class="sidebar">

            <h3>
                Pages
            </h3>


            <div id="thumbnails"></div>

        </aside>



        <!-- ============================
             CENTER: PDF
        ============================= -->

        <main class="pdf-area">

            <div id="pagesContainer"></div>

        </main>



        <!-- ============================
             RIGHT: PROPERTIES
        ============================= -->

        <aside class="properties">

            <h3>
                Text Properties
            </h3>


            <div
                id="noSelection"
                class="no-selection">

                Select a text element to edit
                its properties.

            </div>


            <div
                id="propertiesForm"
                style="display:none;">


                <div class="property">

                    <label>
                        Text
                    </label>

                    <textarea
                        id="textValue"
                        rows="4"
                        style="
                            width:100%;
                            padding:8px;
                            border:1px solid #ccc;
                            border-radius:5px;
                            resize:vertical;
                        "
                    ></textarea>

                </div>


                <div class="property">

                    <label>
                        Font Size
                    </label>

                    <input
                        id="fontSize"
                        type="number"
                        min="6"
                        max="100"
                        value="16"
                    >

                </div>


                <div class="property">

                    <label>
                        Text Color
                    </label>

                    <input
                        id="textColor"
                        class="color-input"
                        type="color"
                        value="#000000"
                    >

                </div>


                <button
                    class="danger"
                    style="width:100%;"
                    onclick="deleteSelectedText()">

                    🗑️ Delete Text

                </button>


            </div>

        </aside>


    </div>


</section>



<!-- =====================================================
     BOTTOM TOOLBAR
===================================================== -->

<div
    id="toolbar"
    class="toolbar"
    style="display:none;">

    <button
        class="primary"
        onclick="addText()">

        ✏️ Add Text

    </button>


    <button
        class="secondary"
        onclick="zoomOut()">

        −

    </button>


    <span
        id="zoomValue"
        style="
            padding:9px;
            min-width:55px;
            text-align:center;
        ">

        100%

    </span>


    <button
        class="secondary"
        onclick="zoomIn()">

        +

    </button>

</div>



<!-- =====================================================
     LOADING
===================================================== -->

<div id="loading">

    <div class="loading-box">

        <div class="spinner"></div>

        <div id="loadingText">
            Processing PDF...
        </div>

    </div>

</div>



<!-- =====================================================
     PDF LIB
===================================================== -->

<script
    src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js">
</script>



<script type="module">

/* =====================================================
   PDF.JS
===================================================== */

import * as pdfjsLib
    from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs";


/*
 * PDF.js worker
 */

pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";



/* =====================================================
   GLOBAL VARIABLES
===================================================== */

let pdfDocument = null;

let originalPDFBytes = null;

let pdfFileName = "edited.pdf";

let zoom = 1;

let selectedText = null;

let textCounter = 0;


/*
 * Store every text added by the user.
 *
 * Example:
 *
 * {
 *    id: 1,
 *    page: 1,
 *    text: "Hello",
 *    x: 100,
 *    y: 100,
 *    fontSize: 16,
 *    color: "#000000"
 * }
 */

let textElements = [];



/* =====================================================
   FILE UPLOAD
===================================================== */

document
    .getElementById("fileInput")
    .addEventListener(
        "change",
        handleFileUpload
    );



async function handleFileUpload(event) {

    const file =
        event.target.files[0];


    if (!file) {

        return;

    }


    if (
        file.type !==
        "application/pdf"
    ) {

        alert(
            "Please select a PDF file."
        );

        return;

    }


    showLoading(
        "Loading PDF..."
    );


    try {

        originalPDFBytes =
            await file.arrayBuffer();


        pdfFileName =
            file.name.replace(
                /\.pdf$/i,
                ""
            ) + "_edited.pdf";


        pdfDocument =
            await pdfjsLib.getDocument({
                data: originalPDFBytes.slice(0)
            }).promise;


        textElements = [];

        selectedText = null;

        textCounter = 0;

        zoom = 1;


        await renderPDF();


        document.getElementById(
            "uploadScreen"
        ).style.display = "none";


        document.getElementById(
            "editor"
        ).style.display = "block";


        document.getElementById(
            "toolbar"
        ).style.display = "flex";


        document.getElementById(
            "saveButton"
        ).disabled = false;


    }

    catch (error) {

        console.error(error);

        alert(
            "Unable to open this PDF."
        );

    }

    finally {

        hideLoading();

    }

}



/* =====================================================
   RENDER PDF
===================================================== */

async function renderPDF() {

    const container =
        document.getElementById(
            "pagesContainer"
        );


    const thumbnails =
        document.getElementById(
            "thumbnails"
        );


    container.innerHTML = "";

    thumbnails.innerHTML = "";


    for (
        let pageNumber = 1;
        pageNumber <= pdfDocument.numPages;
        pageNumber++
    ) {

        await renderPage(
            pageNumber,
            container
        );


        await renderThumbnail(
            pageNumber,
            thumbnails
        );

    }


    updateZoomLabel();

}



/* =====================================================
   RENDER PAGE
===================================================== */

async function renderPage(
    pageNumber,
    container
) {

    const page =
        await pdfDocument.getPage(
            pageNumber
        );


    const viewport =
        page.getViewport({
            scale: zoom
        });


    const wrapper =
        document.createElement("div");


    wrapper.className =
        "pdf-page-wrapper";


    wrapper.dataset.page =
        pageNumber;


    wrapper.style.width =
        viewport.width + "px";


    wrapper.style.height =
        viewport.height + "px";


    const canvas =
        document.createElement("canvas");


    const context =
        canvas.getContext("2d");


    canvas.width =
        viewport.width;


    canvas.height =
        viewport.height;


    wrapper.appendChild(
        canvas
    );


    /*
     * Text layer where our
     * editable elements live.
     */

    const textLayer =
        document.createElement("div");


    textLayer.className =
        "text-layer";


    textLayer.dataset.page =
        pageNumber;


    wrapper.appendChild(
        textLayer
    );


    container.appendChild(
        wrapper
    );


    await page.render({

        canvasContext:
            context,

        viewport:
            viewport

    }).promise;


    /*
     * Re-create user-added
     * text for this page.
     */

    restoreTextElements(
        pageNumber,
        textLayer
    );

}



/* =====================================================
   THUMBNAIL
===================================================== */

async function renderThumbnail(
    pageNumber,
    container
) {

    const page =
        await pdfDocument.getPage(
            pageNumber
        );


    const scale = 0.2;


    const viewport =
        page.getViewport({
            scale
        });


    const wrapper =
        document.createElement(
            "div"
        );


    wrapper.className =
        "thumbnail";


    const canvas =
        document.createElement(
            "canvas"
        );


    canvas.width =
        viewport.width;


    canvas.height =
        viewport.height;


    wrapper.appendChild(
        canvas
    );


    const number =
        document.createElement(
            "div"
        );


    number.className =
        "page-number";


    number.textContent =
        `Page ${pageNumber}`;


    wrapper.appendChild(
        number
    );


    wrapper.onclick = () => {

        const target =
            document.querySelector(
                `.pdf-page-wrapper[data-page="${pageNumber}"]`
            );


        if (target) {

            target.scrollIntoView({
                behavior: "smooth",
                block: "start"
            });

        }

    };


    container.appendChild(
        wrapper
    );


    await page.render({

        canvasContext:
            canvas.getContext("2d"),

        viewport:
            viewport

    }).promise;

}



/* =====================================================
   ADD TEXT
===================================================== */

function addText() {

    if (!pdfDocument) {

        return;

    }


    /*
     * Add to page 1 by default.
     */

    const pageNumber = 1;


    const pageWrapper =
        document.querySelector(
            `.pdf-page-wrapper[data-page="${pageNumber}"]`
        );


    if (!pageWrapper) {

        return;

    }


    const textLayer =
        pageWrapper.querySelector(
            ".text-layer"
        );


    textCounter++;


    const element = {

        id: textCounter,

        page: pageNumber,

        text: "Double click to edit",

        x: 50,

        y: 50,

        fontSize: 16,

        color: "#000000"

    };


    textElements.push(
        element
    );


    createTextElement(
        element,
        textLayer
    );


    selectTextElement(
        element
    );

}



/* =====================================================
   CREATE TEXT ELEMENT
===================================================== */

function createTextElement(
    data,
    textLayer
) {

    const element =
        document.createElement("div");


    element.className =
        "editable-text";


    element.dataset.id =
        data.id;


    element.textContent =
        data.text;


    element.style.left =
        data.x + "px";


    element.style.top =
        data.y + "px";


    element.style.fontSize =
        data.fontSize + "px";


    element.style.color =
        data.color;


    /*
     * Click = select
     */

    element.addEventListener(
        "click",
        event => {

            event.stopPropagation();

            selectTextElement(
                data
            );

        }
    );


    /*
     * Double click = edit
     */

    element.addEventListener(
        "dblclick",
        event => {

            event.stopPropagation();

            element.contentEditable =
                "true";

            element.focus();

        }
    );


    /*
     * Finish editing
     */

    element.addEventListener(
        "blur",
        () => {

            element.contentEditable =
                "false";


            data.text =
                element.innerText;

            updatePropertiesPanel();

        }
    );


    /*
     * Dragging
     */

    let dragging = false;

    let startX = 0;

    let startY = 0;

    let originalX = 0;

    let originalY = 0;


    element.addEventListener(
        "mousedown",
        event => {

            if (
                element.contentEditable ===
                "true"
            ) {

                return;

            }


            dragging = true;


            startX =
                event.clientX;


            startY =
                event.clientY;


            originalX =
                data.x;


            originalY =
                data.y;


            event.preventDefault();

        }
    );


    document.addEventListener(
        "mousemove",
        event => {

            if (!dragging) {

                return;

            }


            const dx =
                event.clientX -
                startX;


            const dy =
                event.clientY -
                startY;


            data.x =
                originalX + dx;


            data.y =
                originalY + dy;


            element.style.left =
                data.x + "px";


            element.style.top =
                data.y + "px";

        }
    );


    document.addEventListener(
        "mouseup",
        () => {

            dragging = false;

        }
    );


    textLayer.appendChild(
        element
    );

}



/* =====================================================
   RESTORE TEXT
===================================================== */

function restoreTextElements(
    pageNumber,
    textLayer
) {

    const pageElements =
        textElements.filter(
            item =>
                item.page ===
                pageNumber
        );


    pageElements.forEach(
        item => {

            createTextElement(
                item,
                textLayer
            );

        }
    );

}



/* =====================================================
   SELECT TEXT
===================================================== */

function selectTextElement(
    data
) {

    selectedText =
        data;


    /*
     * Remove previous selection
     */

    document
        .querySelectorAll(
            ".editable-text"
        )
        .forEach(
            element => {

                element.classList.remove(
                    "selected"
                );

            }
        );


    const element =
        document.querySelector(
            `.editable-text[data-id="${data.id}"]`
        );


    if (element) {

        element.classList.add(
            "selected"
        );

    }


    updatePropertiesPanel();

}



/* =====================================================
   PROPERTIES PANEL
===================================================== */

function updatePropertiesPanel() {

    const noSelection =
        document.getElementById(
            "noSelection"
        );


    const form =
        document.getElementById(
            "propertiesForm"
        );


    if (!selectedText) {

        noSelection.style.display =
            "block";

        form.style.display =
            "none";

        return;

    }


    noSelection.style.display =
        "none";


    form.style.display =
        "block";


    document.getElementById(
        "textValue"
    ).value =
        selectedText.text;


    document.getElementById(
        "fontSize"
    ).value =
        selectedText.fontSize;


    document.getElementById(
        "textColor"
    ).value =
        selectedText.color;

}



/* =====================================================
   TEXT VALUE CHANGE
===================================================== */

document
    .getElementById("textValue")
    .addEventListener(
        "input",
        event => {

            if (!selectedText) {

                return;

            }


            selectedText.text =
                event.target.value;


            updateSelectedDOM();

        }
    );



/* =====================================================
   FONT SIZE CHANGE
===================================================== */

document
    .getElementById("fontSize")
    .addEventListener(
        "input",
        event => {

            if (!selectedText) {

                return;

            }


            selectedText.fontSize =
                Number(
                    event.target.value
                );


            updateSelectedDOM();

        }
    );



/* =====================================================
   COLOR CHANGE
===================================================== */

document
    .getElementById("textColor")
    .addEventListener(
        "input",
        event => {

            if (!selectedText) {

                return;

            }


            selectedText.color =
                event.target.value;


            updateSelectedDOM();

        }
    );



/* =====================================================
   UPDATE DOM
===================================================== */

function updateSelectedDOM() {

    if (!selectedText) {

        return;

    }


    const element =
        document.querySelector(
            `.editable-text[data-id="${selectedText.id}"]`
        );


    if (!element) {

        return;

    }


    element.textContent =
        selectedText.text;


    element.style.fontSize =
        selectedText.fontSize + "px";


    element.style.color =
        selectedText.color;

}



/* =====================================================
   DELETE SELECTED TEXT
===================================================== */

function deleteSelectedText() {

    if (!selectedText) {

        return;

    }


    const confirmed =
        confirm(
            "Delete this text?"
        );


    if (!confirmed) {

        return;

    }


    const id =
        selectedText.id;


    /*
     * Remove from data
     */

    textElements =
        textElements.filter(
            item =>
                item.id !== id
        );


    /*
     * Remove from DOM
     */

    const element =
        document.querySelector(
            `.editable-text[data-id="${id}"]`
        );


    if (element) {

        element.remove();

    }


    selectedText = null;


    updatePropertiesPanel();

}



/* =====================================================
   ZOOM
===================================================== */

window.zoomIn = function() {

    if (zoom >= 2) {

        return;

    }


    zoom += 0.1;


    rerenderPages();

};



window.zoomOut = function() {

    if (zoom <= 0.5) {

        return;

    }


    zoom -= 0.1;


    rerenderPages();

};



async function rerenderPages() {

    showLoading(
        "Updating view..."
    );


    try {

        const container =
            document.getElementById(
                "pagesContainer"
            );


        const thumbnails =
            document.getElementById(
                "thumbnails"
            );


        container.innerHTML =
            "";


        thumbnails.innerHTML =
            "";


        await renderPDF();

    }

    finally {

        hideLoading();

    }

}



function updateZoomLabel() {

    document.getElementById(
        "zoomValue"
    ).textContent =
        Math.round(
            zoom * 100
        ) + "%";

}



/* =====================================================
   SAVE PDF
===================================================== */

window.savePDF = async function() {

    if (!originalPDFBytes) {

        alert(
            "Please upload a PDF first."
        );

        return;

    }


    showLoading(
        "Creating edited PDF..."
    );


    try {

        /*
         * PDF-LIB
         */

        const {
            PDFDocument,
            rgb,
            StandardFonts
        } = window.PDFLib;


        /*
         * Load original PDF
         */

        const pdfDoc =
            await PDFDocument.load(
                originalPDFBytes
            );


        const pages =
            pdfDoc.getPages();


        /*
         * Use Helvetica
         */

        const font =
            await pdfDoc.embedFont(
                StandardFonts.Helvetica
            );


        /*
         * Add each text element
         */

        for (
            const item of textElements
        ) {

            const pageIndex =
                item.page - 1;


            const page =
                pages[pageIndex];


            if (!page) {

                continue;

            }


            /*
             * IMPORTANT:
             *
             * Browser coordinates:
             *
             * top-left = 0,0
             *
             * PDF coordinates:
             *
             * bottom-left = 0,0
             */


            const pageHeight =
                page.getHeight();


            /*
             * Convert browser
             * coordinates to PDF.
             */

            const pdfX =
                item.x / zoom;


            const pdfY =
                pageHeight -
                (item.y / zoom) -
                (item.fontSize / zoom);


            /*
             * Convert hex color
             * to RGB.
             */

            const color =
                hexToRgb(
                    item.color
                );


            page.drawText(
                item.text,
                {

                    x: pdfX,

                    y: pdfY,

                    size:
                        item.fontSize /
                        zoom,

                    font:

                        font,

                    color:

                        rgb(
                            color.r,
                            color.g,
                            color.b
                        ),

                    lineHeight:
                        item.fontSize /
                        zoom * 1.2

                }
            );

        }


        /*
         * Generate final PDF
         */

        const pdfBytes =
            await pdfDoc.save();


        /*
         * Download
         */

        downloadFile(
            pdfBytes,
            pdfFileName
        );


    }

    catch (error) {

        console.error(error);

        alert(
            "Unable to save the PDF.\n\n" +
            error.message
        );

    }

    finally {

        hideLoading();

    }

};



/* =====================================================
   HEX → RGB
===================================================== */

function hexToRgb(
    hex
) {

    hex =
        hex.replace(
            "#",
            ""
        );


    const r =
        parseInt(
            hex.substring(0, 2),
            16
        ) / 255;


    const g =
        parseInt(
            hex.substring(2, 4),
            16
        ) / 255;


    const b =
        parseInt(
            hex.substring(4, 6),
            16
        ) / 255;


    return {
        r,
        g,
        b
    };

}



/* =====================================================
   DOWNLOAD
===================================================== */

function downloadFile(
    bytes,
    filename
) {

    const blob =
        new Blob(
            [bytes],
            {
                type:
                    "application/pdf"
            }
        );


    const url =
        URL.createObjectURL(
            blob
        );


    const link =
        document.createElement(
            "a"
        );


    link.href =
        url;


    link.download =
        filename;


    document.body.appendChild(
        link
    );


    link.click();


    link.remove();


    URL.revokeObjectURL(
        url
    );

}



/* =====================================================
   NEW DOCUMENT
===================================================== */

window.newDocument = function() {

    const confirmed =
        confirm(
            "Open another PDF?"
        );


    if (!confirmed) {

        return;

    }


    location.reload();

};



/* =====================================================
   LOADING
===================================================== */

function showLoading(
    message
) {

    document.getElementById(
        "loadingText"
    ).textContent =
        message;


    document.getElementById(
        "loading"
    ).style.display =
        "flex";

}



function hideLoading() {

    document.getElementById(
        "loading"
    ).style.display =
        "none";

}
