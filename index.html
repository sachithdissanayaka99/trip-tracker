<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PDF Editor</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f1f3f5;
    color: #222;
}

/* HEADER */

header {
    height: 60px;
    background: #1f2937;
    color: white;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
}

header h2 {
    margin: 0;
    font-size: 20px;
}

.header-buttons {
    display: flex;
    gap: 8px;
}

button {
    border: none;
    border-radius: 6px;
    padding: 9px 14px;
    cursor: pointer;
    font-size: 14px;
}

button:hover {
    opacity: 0.9;
}

.primary {
    background: #2563eb;
    color: white;
}

.success {
    background: #16a34a;
    color: white;
}

.danger {
    background: #dc2626;
    color: white;
}

.secondary {
    background: #e5e7eb;
    color: #111827;
}

/* UPLOAD */

#uploadScreen {
    min-height: calc(100vh - 60px);
    display: flex;
    align-items: center;
    justify-content: center;
}

.upload-box {
    background: white;
    padding: 40px;
    width: 90%;
    max-width: 500px;
    text-align: center;
    border-radius: 12px;
    box-shadow: 0 5px 25px rgba(0,0,0,0.1);
}

.upload-box h1 {
    margin-top: 0;
}

.file-input {
    margin-top: 20px;
}

/* EDITOR */

#editor {
    display: none;
    height: calc(100vh - 60px);
}

.editor-layout {
    display: grid;
    grid-template-columns: 180px 1fr 240px;
    height: 100%;
}

/* SIDEBAR */

.sidebar {
    background: #ffffff;
    border-right: 1px solid #ddd;
    overflow-y: auto;
    padding: 10px;
}

.sidebar h3 {
    margin: 5px 0 15px;
}

.thumbnail {
    width: 100%;
    margin-bottom: 12px;
    cursor: pointer;
    border: 2px solid transparent;
    border-radius: 5px;
    overflow: hidden;
}

.thumbnail:hover {
    border-color: #2563eb;
}

.thumbnail canvas {
    width: 100%;
    display: block;
}

/* MAIN */

.main-area {
    position: relative;
    overflow: auto;
    background: #525659;
}

.toolbar {
    position: sticky;
    top: 0;
    z-index: 100;
    background: white;
    padding: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
    border-bottom: 1px solid #ddd;
}

.toolbar button.active {
    background: #2563eb;
    color: white;
}

.zoom-label {
    margin-left: auto;
    font-weight: bold;
}

#pdfContainer {
    padding: 30px;
}

/* PDF PAGE */

.pdf-page {
    position: relative;
    margin: 0 auto 30px auto;
    background: white;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
}

.pdf-page canvas {
    display: block;
}

.text-layer {
    position: absolute;
    left: 0;
    top: 0;
    right: 0;
    bottom: 0;
    overflow: hidden;
}

/* ADDED TEXT */

.added-text {
    position: absolute;
    min-width: 20px;
    min-height: 20px;
    padding: 2px;
    cursor: move;
    border: 1px dashed transparent;
    white-space: pre-wrap;
    user-select: none;
}

.added-text:hover {
    border-color: #2563eb;
}

.added-text.selected {
    border: 1px solid #2563eb;
    background: rgba(37,99,235,0.08);
}

/* EXISTING PDF TEXT */

.existing-text {
    position: absolute;
    cursor: pointer;
    color: transparent;
    white-space: pre;
    transform-origin: left top;
}

.existing-text:hover {
    background: rgba(37,99,235,0.15);
}

.existing-text.selected {
    background: rgba(255,255,255,0.95);
    color: #111;
    outline: 2px solid #2563eb;
}

/* RIGHT PANEL */

.properties {
    background: white;
    border-left: 1px solid #ddd;
    padding: 15px;
    overflow-y: auto;
}

.properties h3 {
    margin-top: 0;
}

.property-group {
    margin-bottom: 18px;
}

.property-group label {
    display: block;
    font-size: 13px;
    font-weight: bold;
    margin-bottom: 6px;
}

.property-group input,
.property-group textarea {
    width: 100%;
    padding: 8px;
    border: 1px solid #ccc;
    border-radius: 5px;
}

.property-group textarea {
    min-height: 90px;
    resize: vertical;
}

#noSelection {
    color: #777;
    font-size: 14px;
}

/* MESSAGES */

#errorBox,
#successBox {
    position: fixed;
    top: 75px;
    right: 20px;
    max-width: 400px;
    padding: 14px 18px;
    border-radius: 7px;
    z-index: 9999;
    display: none;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
}

#errorBox {
    background: #fee2e2;
    color: #991b1b;
    border: 1px solid #ef4444;
}

#successBox {
    background: #dcfce7;
    color: #166534;
    border: 1px solid #22c55e;
}

/* LOADING */

#loading {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    z-index: 10000;
    display: none;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 20px;
}

/* MOBILE */

@media(max-width: 900px) {

    .editor-layout {
        grid-template-columns: 100px 1fr;
    }

    .properties {
        display: none;
    }

    .sidebar {
        width: 100px;
    }

    #pdfContainer {
        padding: 15px;
    }
}
</style>
</head>

<body>

<header>

    <h2>PDF Editor</h2>

    <div class="header-buttons">

        <button class="secondary" onclick="newPDF()">
            New PDF
        </button>

        <button class="success" onclick="savePDF()">
            Save PDF
        </button>

    </div>

</header>


<!-- ERROR -->

<div id="errorBox"></div>
<div id="successBox"></div>


<!-- LOADING -->

<div id="loading">
    Processing PDF...
</div>


<!-- UPLOAD SCREEN -->

<div id="uploadScreen">

    <div class="upload-box">

        <h1>PDF Editor</h1>

        <p>
            Upload a PDF to start editing.
        </p>

        <input
            type="file"
            id="fileInput"
            class="file-input"
            accept="application/pdf"
        >

        <p style="font-size:13px;color:#777;">
            Text-based PDFs work best.
        </p>

    </div>

</div>


<!-- EDITOR -->

<div id="editor">

    <div class="editor-layout">

        <!-- PAGE SIDEBAR -->

        <aside class="sidebar">

            <h3>Pages</h3>

            <div id="thumbnails"></div>

        </aside>


        <!-- MAIN PDF AREA -->

        <main class="main-area">

            <div class="toolbar">

                <button
                    id="addTextButton"
                    class="primary"
                    onclick="toggleAddText()">
                    + Add Text
                </button>

                <button
                    class="secondary"
                    onclick="zoomOut()">
                    −
                </button>

                <button
                    class="secondary"
                    onclick="zoomIn()">
                    +
                </button>

                <button
                    class="secondary"
                    onclick="resetZoom()">
                    Reset
                </button>

                <span
                    id="zoomLabel"
                    class="zoom-label">
                    100%
                </span>

            </div>

            <div id="pdfContainer"></div>

        </main>


        <!-- PROPERTIES -->

        <aside class="properties">

            <h3>Properties</h3>

            <div id="noSelection">

                Select text to edit it.

                <br><br>

                Or click <b>+ Add Text</b>
                and then click anywhere on the PDF.

            </div>


            <div id="propertyPanel" style="display:none;">

                <div class="property-group">

                    <label>Text</label>

                    <textarea
                        id="textInput"
                        placeholder="Enter text">
                    </textarea>

                </div>


                <div class="property-group">

                    <label>Font Size</label>

                    <input
                        id="fontSizeInput"
                        type="number"
                        min="5"
                        max="100"
                        value="16">

                </div>


                <div class="property-group">

                    <label>Text Color</label>

                    <input
                        id="colorInput"
                        type="color"
                        value="#000000">

                </div>


                <button
                    class="danger"
                    style="width:100%;"
                    onclick="deleteSelected()">

                    Delete Text

                </button>


                <button
                    class="secondary"
                    style="width:100%;margin-top:8px;"
                    onclick="undoSelected()">

                    Undo Changes

                </button>

            </div>

        </aside>

    </div>

</div>


<script>

/* =========================================================
   PDF.JS CONFIG
========================================================= */

pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


/* =========================================================
   GLOBAL STATE
========================================================= */

let pdfDocument = null;

let originalPDFBytes = null;

let originalFileName = "edited.pdf";

let zoom = 1;

let selectedObject = null;

let addTextMode = false;

let objectId = 0;


/*
Each edit is stored here.

New text:

{
    type: "new",
    id,
    page,
    x,
    y,
    text,
    fontSize,
    color
}

Existing text:

{
    type: "existing",
    id,
    page,
    x,
    y,
    width,
    height,
    originalText,
    text,
    fontSize,
    originalFontSize,
    changed
}
*/

let edits = [];


/* =========================================================
   UI HELPERS
========================================================= */

function showError(message) {

    const box = document.getElementById("errorBox");

    box.innerHTML = "❌ " + message;

    box.style.display = "block";

    setTimeout(() => {
        box.style.display = "none";
    }, 6000);
}


function showSuccess(message) {

    const box = document.getElementById("successBox");

    box.innerHTML = "✓ " + message;

    box.style.display = "block";

    setTimeout(() => {
        box.style.display = "none";
    }, 4000);
}


function setLoading(show) {

    document.getElementById("loading").style.display =
        show ? "flex" : "none";
}


/* =========================================================
   FILE UPLOAD
========================================================= */

document
    .getElementById("fileInput")
    .addEventListener("change", async function(e) {

        const file = e.target.files[0];

        if (!file) {
            return;
        }

        if (file.type !== "application/pdf") {

            showError("Please select a valid PDF file.");

            return;
        }

        try {

            setLoading(true);

            originalFileName = file.name;

            const buffer = await file.arrayBuffer();

            /*
                Make our own copy.
            */

            originalPDFBytes = new Uint8Array(buffer);

            pdfDocument = await pdfjsLib.getDocument({
                data: originalPDFBytes
            }).promise;


            /*
                Reset state
            */

            edits = [];

            selectedObject = null;

            objectId = 0;

            zoom = 1;

            document.getElementById("uploadScreen").style.display =
                "none";

            document.getElementById("editor").style.display =
                "block";


            await renderPDF();

            showSuccess(
                `PDF loaded successfully — ${pdfDocument.numPages} page(s).`
            );

        }
        catch(error) {

            console.error(error);

            showError(
                "Could not open this PDF. " +
                (error.message || "Unknown PDF error.")
            );

        }
        finally {

            setLoading(false);

        }

    });


/* =========================================================
   RENDER PDF
========================================================= */

async function renderPDF() {

    const container =
        document.getElementById("pdfContainer");

    const thumbnails =
        document.getElementById("thumbnails");

    container.innerHTML = "";

    thumbnails.innerHTML = "";


    for (
        let pageNumber = 1;
        pageNumber <= pdfDocument.numPages;
        pageNumber++
    ) {

        await renderPage(pageNumber);

        await renderThumbnail(pageNumber);

    }


    updateZoomLabel();

}


/* =========================================================
   RENDER PAGE
========================================================= */

async function renderPage(pageNumber) {

    const page =
        await pdfDocument.getPage(pageNumber);


    const viewport =
        page.getViewport({
            scale: zoom
        });


    /*
        PAGE
    */

    const pageDiv =
        document.createElement("div");

    pageDiv.className = "pdf-page";

    pageDiv.dataset.page =
        pageNumber;

    pageDiv.style.width =
        viewport.width + "px";

    pageDiv.style.height =
        viewport.height + "px";


    /*
        CANVAS
    */

    const canvas =
        document.createElement("canvas");

    canvas.width =
        viewport.width;

    canvas.height =
        viewport.height;

    canvas.style.width =
        viewport.width + "px";

    canvas.style.height =
        viewport.height + "px";


    const context =
        canvas.getContext("2d");


    await page.render({
        canvasContext: context,
        viewport: viewport
    }).promise;


    pageDiv.appendChild(canvas);


    /*
        TEXT LAYER
    */

    const textLayer =
        document.createElement("div");

    textLayer.className =
        "text-layer";

    pageDiv.appendChild(textLayer);


    document
        .getElementById("pdfContainer")
        .appendChild(pageDiv);


    /*
        Existing PDF text
    */

    await renderExistingText(
        page,
        textLayer,
        pageNumber
    );


    /*
        Restore user-added text
    */

    restoreNewText(
        pageNumber,
        textLayer
    );

}


/* =========================================================
   EXISTING PDF TEXT
========================================================= */

async function renderExistingText(
    page,
    layer,
    pageNumber
) {

    let textContent;

    try {

        textContent =
            await page.getTextContent();

    }
    catch(error) {

        console.error(error);

        showError(
            "Could not read the text layer of page " +
            pageNumber
        );

        return;
    }


    /*
        Use a scale=1 viewport to keep our
        stored coordinates independent of zoom.
    */

    const baseViewport =
        page.getViewport({
            scale: 1
        });


    for (const item of textContent.items) {

        if (!item.str || !item.str.trim()) {
            continue;
        }


        const transform =
            pdfjsLib.Util.transform(
                baseViewport.transform,
                item.transform
            );


        const x =
            transform[4];

        const y =
            transform[5];


        const fontSize =
            Math.abs(transform[3]);


        const width =
            Math.max(
                item.width || 20,
                20
            );


        /*
            PDF.js gives baseline coordinates.

            Convert to top-left coordinate.
        */

        const top =
            baseViewport.height -
            y -
            fontSize;


        const id =
            "existing-" +
            (++objectId);


        const edit = {

            id,

            type: "existing",

            page: pageNumber,

            x: x,

            y: top,

            width: width,

            height: fontSize * 1.3,

            originalText: item.str,

            text: item.str,

            fontSize: fontSize,

            originalFontSize: fontSize,

            changed: false

        };


        edits.push(edit);


        /*
            DOM
        */

        const div =
            document.createElement("div");

        div.className =
            "existing-text";

        div.dataset.id =
            id;

        div.textContent =
            item.str;


        div.style.left =
            (x * zoom) + "px";

        div.style.top =
            (top * zoom) + "px";

        div.style.width =
            (width * zoom) + "px";

        div.style.height =
            (fontSize * 1.5 * zoom) + "px";

        div.style.fontSize =
            (fontSize * zoom) + "px";


        /*
            IMPORTANT:
            Clicking existing text selects it.
        */

        div.addEventListener(
            "click",
            function(e) {

                e.stopPropagation();

                selectObject(edit);

            }
        );


        /*
            Double click automatically focuses
            the text editor.
        */

        div.addEventListener(
            "dblclick",
            function(e) {

                e.stopPropagation();

                selectObject(edit);

                setTimeout(() => {

                    const input =
                        document.getElementById(
                            "textInput"
                        );

                    input.focus();

                    input.select();

                }, 50);

            }
        );


        layer.appendChild(div);

    }

}


/* =========================================================
   RESTORE NEW TEXT
========================================================= */

function restoreNewText(
    pageNumber,
    layer
) {

    const pageEdits =
        edits.filter(e =>
            e.type === "new" &&
            e.page === pageNumber
        );


    for (const edit of pageEdits) {

        createNewTextElement(
            edit,
            layer
        );

    }

}


/* =========================================================
   ADD TEXT
========================================================= */

function toggleAddText() {

    if (!pdfDocument) {

        showError(
            "Please upload a PDF first."
        );

        return;
    }


    addTextMode =
        !addTextMode;


    const button =
        document.getElementById(
            "addTextButton"
        );


    if (addTextMode) {

        button.classList.add("active");

        button.textContent =
            "Click PDF to Add Text";

        document.body.style.cursor =
            "crosshair";

    }
    else {

        button.classList.remove("active");

        button.textContent =
            "+ Add Text";

        document.body.style.cursor =
            "default";

    }

}


/* =========================================================
   CLICK PDF TO ADD TEXT
========================================================= */

document.addEventListener(
    "click",
    function(e) {

        if (!addTextMode) {
            return;
        }


        const page =
            e.target.closest(".pdf-page");


        if (!page) {
            return;
        }


        /*
            Don't trigger when clicking an existing
            or already-added text.
        */

        if (
            e.target.closest(".existing-text") ||
            e.target.closest(".added-text")
        ) {

            return;

        }


        const rect =
            page.getBoundingClientRect();


        /*
            Convert screen coordinates to PDF
            coordinates independent of zoom.
        */

        const x =
            (e.clientX - rect.left) /
            zoom;


        const y =
            (e.clientY - rect.top) /
            zoom;


        const newEdit = {

            id:
                "new-" +
                (++objectId),

            type: "new",

            page:
                Number(page.dataset.page),

            x: x,

            y: y,

            text:
                "New text",

            fontSize:
                16,

            color:
                "#000000"

        };


        edits.push(newEdit);


        /*
            Find layer
        */

        const layer =
            page.querySelector(
                ".text-layer"
            );


        createNewTextElement(
            newEdit,
            layer
        );


        selectObject(
            newEdit
        );


        /*
            Turn add mode off
        */

        toggleAddText();

    }
);


/* =========================================================
   CREATE NEW TEXT ELEMENT
========================================================= */

function createNewTextElement(
    edit,
    layer
) {

    const div =
        document.createElement("div");


    div.className =
        "added-text";


    div.dataset.id =
        edit.id;


    div.textContent =
        edit.text;


    div.style.left =
        (edit.x * zoom) + "px";


    div.style.top =
        (edit.y * zoom) + "px";


    div.style.fontSize =
        (edit.fontSize * zoom) + "px";


    div.style.color =
        edit.color;


    layer.appendChild(div);


    /*
        CLICK
    */

    div.addEventListener(
        "click",
        function(e) {

            e.stopPropagation();

            selectObject(edit);

        }
    );


    /*
        DOUBLE CLICK
    */

    div.addEventListener(
        "dblclick",
        function(e) {

            e.stopPropagation();

            selectObject(edit);

            document
                .getElementById("textInput")
                .focus();

        }
    );


    /*
        DRAG
    */

    makeDraggable(
        div,
        edit
    );

}


/* =========================================================
   DRAG TEXT
========================================================= */

function makeDraggable(
    element,
    edit
) {

    let dragging = false;

    let startX = 0;

    let startY = 0;

    let originalX = 0;

    let originalY = 0;


    element.addEventListener(
        "pointerdown",
        function(e) {

            e.stopPropagation();

            dragging = true;

            element.setPointerCapture(
                e.pointerId
            );


            startX =
                e.clientX;

            startY =
                e.clientY;


            originalX =
                edit.x;

            originalY =
                edit.y;

            selectObject(edit);

        }
    );


    element.addEventListener(
        "pointermove",
        function(e) {

            if (!dragging) {
                return;
            }


            const dx =
                (e.clientX - startX) /
                zoom;


            const dy =
                (e.clientY - startY) /
                zoom;


            edit.x =
                originalX + dx;


            edit.y =
                originalY + dy;


            element.style.left =
                (edit.x * zoom) + "px";


            element.style.top =
                (edit.y * zoom) + "px";

        }
    );


    element.addEventListener(
        "pointerup",
        function(e) {

            dragging = false;

        }
    );

}


/* =========================================================
   SELECT OBJECT
========================================================= */

function selectObject(
    edit
) {

    selectedObject =
        edit;


    /*
        Remove previous selections
    */

    document
        .querySelectorAll(
            ".selected"
        )
        .forEach(el => {

            el.classList.remove(
                "selected"
            );

        });


    /*
        Select DOM object
    */

    const element =
        document.querySelector(
            `[data-id="${edit.id}"]`
        );


    if (element) {

        element.classList.add(
            "selected"
        );

    }


    /*
        Show property panel
    */

    document.getElementById(
        "noSelection"
    ).style.display =
        "none";


    document.getElementById(
        "propertyPanel"
    ).style.display =
        "block";


    /*
        Load values
    */

    document.getElementById(
        "textInput"
    ).value =
        edit.text;


    document.getElementById(
        "fontSizeInput"
    ).value =
        edit.fontSize;


    document.getElementById(
        "colorInput"
    ).value =
        edit.color ||
        "#000000";

}


/* =========================================================
   TEXT INPUT
========================================================= */

document
    .getElementById("textInput")
    .addEventListener(
        "input",
        function() {

            if (!selectedObject) {
                return;
            }


            selectedObject.text =
                this.value;


            updateSelectedDOM();

        }
    );


/* =========================================================
   FONT SIZE
========================================================= */

document
    .getElementById("fontSizeInput")
    .addEventListener(
        "input",
        function() {

            if (!selectedObject) {
                return;
            }


            let size =
                Number(this.value);


            if (
                !size ||
                size < 5 ||
                size > 100
            ) {

                return;

            }


            selectedObject.fontSize =
                size;


            if (
                selectedObject.type ===
                "existing"
            ) {

                selectedObject.changed =
                    true;

            }


            updateSelectedDOM();

        }
    );


/* =========================================================
   COLOR
========================================================= */

document
    .getElementById("colorInput")
    .addEventListener(
        "input",
        function() {

            if (!selectedObject) {
                return;
            }


            selectedObject.color =
                this.value;


            if (
                selectedObject.type ===
                "existing"
            ) {

                selectedObject.changed =
                    true;

            }


            updateSelectedDOM();

        }
    );


/* =========================================================
   UPDATE DOM
========================================================= */

function updateSelectedDOM() {

    if (!selectedObject) {
        return;
    }


    const element =
        document.querySelector(
            `[data-id="${selectedObject.id}"]`
        );


    if (!element) {
        return;
    }


    element.textContent =
        selectedObject.text;


    element.style.fontSize =
        (
            selectedObject.fontSize *
            zoom
        ) + "px";


    element.style.color =
        selectedObject.color ||
        "#000000";


    if (
        selectedObject.type ===
        "existing"
    ) {

        element.style.color =
            "#111";

    }

}


/* =========================================================
   DELETE
========================================================= */

function deleteSelected() {

    if (!selectedObject) {

        showError(
            "Select some text first."
        );

        return;
    }


    const index =
        edits.findIndex(
            e =>
                e.id ===
                selectedObject.id
        );


    if (index === -1) {

        showError(
            "Could not find the selected text."
        );

        return;
    }


    /*
        New text:
        completely remove it.
    */

    if (
        selectedObject.type ===
        "new"
    ) {

        edits.splice(
            index,
            1
        );

    }


    /*
        Existing PDF text:
        Mark as deleted.
    */

    else {

        selectedObject.text = "";

        selectedObject.changed =
            true;

    }


    selectedObject =
        null;


    document.getElementById(
        "propertyPanel"
    ).style.display =
        "none";


    document.getElementById(
        "noSelection"
    ).style.display =
        "block";


    /*
        Re-render so deleted existing
        text disappears.
    */

    renderPDF()
        .catch(error => {

            console.error(error);

            showError(
                "Could not refresh the PDF after deletion."
            );

        });

}


/* =========================================================
   UNDO
========================================================= */

function undoSelected() {

    if (!selectedObject) {

        showError(
            "Select some text first."
        );

        return;
    }


    if (
        selectedObject.type ===
        "new"
    ) {

        const index =
            edits.findIndex(
                e =>
                    e.id ===
                    selectedObject.id
            );


        if (index !== -1) {

            edits.splice(
                index,
                1
            );

        }

    }
    else {

        selectedObject.text =
            selectedObject.originalText;

        selectedObject.fontSize =
            selectedObject.originalFontSize;

        selectedObject.changed =
            false;

    }


    selectedObject =
        null;


    document.getElementById(
        "propertyPanel"
    ).style.display =
        "none";


    document.getElementById(
        "noSelection"
    ).style.display =
        "block";


    renderPDF()
        .catch(error => {

            console.error(error);

            showError(
                "Undo failed."
            );

        });

}


/* =========================================================
   ZOOM
========================================================= */

async function zoomIn() {

    zoom += 0.1;

    if (zoom > 3) {
        zoom = 3;
    }

    await rerender();

}


async function zoomOut() {

    zoom -= 0.1;

    if (zoom < 0.5) {
        zoom = 0.5;
    }

    await rerender();

}


async function resetZoom() {

    zoom = 1;

    await rerender();

}


function updateZoomLabel() {

    document.getElementById(
        "zoomLabel"
    ).textContent =
        Math.round(zoom * 100) +
        "%";

}


async function rerender() {

    try {

        setLoading(true);

        await renderPDF();

        updateZoomLabel();

    }
    catch(error) {

        console.error(error);

        showError(
            "Could not render the PDF."
        );

    }
    finally {

        setLoading(false);

    }

}


/* =========================================================
   THUMBNAILS
========================================================= */

async function renderThumbnail(
    pageNumber
) {

    const page =
        await pdfDocument.getPage(
            pageNumber
        );


    const viewport =
        page.getViewport({
            scale: 0.2
        });


    const canvas =
        document.createElement("canvas");


    canvas.width =
        viewport.width;

    canvas.height =
        viewport.height;


    await page.render({

        canvasContext:
            canvas.getContext("2d"),

        viewport:
            viewport

    }).promise;


    const wrapper =
        document.createElement("div");


    wrapper.className =
        "thumbnail";


    wrapper.appendChild(
        canvas
    );


    wrapper.addEventListener(
        "click",
        function() {

            const target =
                document.querySelector(
                    `.pdf-page[data-page="${pageNumber}"]`
                );


            if (target) {

                target.scrollIntoView({
                    behavior: "smooth"
                });

            }

        }
    );


    document
        .getElementById("thumbnails")
        .appendChild(wrapper);

}


/* =========================================================
   SAVE PDF
========================================================= */

async function savePDF() {

    if (!originalPDFBytes) {

        showError(
            "Please upload a PDF first."
        );

        return;
    }


    try {

        setLoading(true);


        const {
            PDFDocument,
            rgb,
            StandardFonts
        } = PDFLib;


        /*
            Load original PDF
        */

        const pdfDoc =
            await PDFDocument.load(
                originalPDFBytes
            );


        const font =
            await pdfDoc.embedFont(
                StandardFonts.Helvetica
            );


        /*
            Process edits
        */

        for (const edit of edits) {

            const page =
                pdfDoc.getPage(
                    edit.page - 1
                );


            /*
                NEW TEXT
            */

            if (
                edit.type ===
                "new"
            ) {

                if (
                    !edit.text ||
                    !edit.text.trim()
                ) {

                    continue;

                }


                const color =
                    hexToRgb(
                        edit.color ||
                        "#000000"
                    );


                /*
                    Convert top-left PDF.js
                    coordinate to PDF
                    bottom-left coordinate.
                */

                const pdfY =
                    page.getHeight() -
                    edit.y -
                    edit.fontSize;


                page.drawText(
                    edit.text,
                    {

                        x:
                            edit.x,

                        y:
                            pdfY,

                        size:
                            edit.fontSize,

                        font:
                            font,

                        color:
                            rgb(
                                color.r / 255,
                                color.g / 255,
                                color.b / 255
                            )

                    }
                );

            }


            /*
                EXISTING TEXT
            */

            if (
                edit.type ===
                "existing" &&
                edit.changed
            ) {

                /*
                    Cover original text with
                    a white rectangle.

                    This works for normal PDFs
                    with white backgrounds.
                */

                const pdfY =
                    page.getHeight() -
                    edit.y -
                    edit.height;


                page.drawRectangle({

                    x:
                        edit.x - 1,

                    y:
                        pdfY - 1,

                    width:
                        edit.width + 4,

                    height:
                        edit.height + 4,

                    color:
                        rgb(
                            1,
                            1,
                            1
                        )

                });


                /*
                    If user deleted the text,
                    don't draw replacement.
                */

                if (
                    edit.text &&
                    edit.text.trim()
                ) {

                    const color =
                        hexToRgb(
                            edit.color ||
                            "#000000"
                        );


                    page.drawText(
                        edit.text,
                        {

                            x:
                                edit.x,

                            y:
                                page.getHeight() -
                                edit.y -
                                edit.fontSize,

                            size:
                                edit.fontSize,

                            font:
                                font,

                            color:
                                rgb(
                                    color.r / 255,
                                    color.g / 255,
                                    color.b / 255
                                )

                        }
                    );

                }

            }

        }


        /*
            Save
        */

        const bytes =
            await pdfDoc.save();


        const blob =
            new Blob(
                [bytes],
                {
                    type:
                        "application/pdf"
                }
            );


        const url =
            URL.createObjectURL(
                blob
            );


        const a =
            document.createElement("a");


        a.href =
            url;


        const baseName =
            originalFileName
                .replace(
                    /\.pdf$/i,
                    ""
                );


        a.download =
            baseName +
            "-edited.pdf";


        document.body.appendChild(a);

        a.click();

        a.remove();


        URL.revokeObjectURL(
            url
        );


        showSuccess(
            "PDF saved successfully."
        );

    }
    catch(error) {

        console.error(error);

        showError(
            "Could not save the PDF: " +
            (error.message ||
             "Unknown error.")
        );

    }
    finally {

        setLoading(false);

    }

}


/* =========================================================
   HEX → RGB
========================================================= */

function hexToRgb(hex) {

    hex =
        hex.replace(
            "#",
            ""
        );


    return {

        r:
            parseInt(
                hex.substring(0, 2),
                16
            ),

        g:
            parseInt(
                hex.substring(2, 4),
                16
            ),

        b:
            parseInt(
                hex.substring(4, 6),
                16
            )

    };

}


/* =========================================================
   NEW PDF
========================================================= */

function newPDF() {

    if (
        edits.length > 0
    ) {

        const confirmReset =
            confirm(
                "Start a new PDF? Unsaved changes will be lost."
            );


        if (!confirmReset) {
            return;
        }

    }


    pdfDocument = null;

    originalPDFBytes = null;

    edits = [];

    selectedObject = null;

    addTextMode = false;

    zoom = 1;

    document.getElementById(
        "pdfContainer"
    ).innerHTML = "";

    document.getElementById(
        "thumbnails"
    ).innerHTML = "";

    document.getElementById(
        "editor"
    ).style.display = "none";

    document.getElementById(
        "uploadScreen"
    ).style.display = "flex";

    document.getElementById(
        "fileInput"
    ).value = "";

    document.body.style.cursor =
        "default";

}


/* =========================================================
   ERROR HANDLING
========================================================= */

window.addEventListener(
    "error",
    function(event) {

        console.error(
            "JavaScript error:",
            event.error
        );

        showError(
            "A JavaScript error occurred. " +
            "Open the browser console for details."
        );

    }
);


window.addEventListener(
    "unhandledrejection",
    function(event) {

        console.error(
            "Unhandled promise rejection:",
            event.reason
        );

        showError(
            "An unexpected PDF processing error occurred."
        );

    }
);

</script>
